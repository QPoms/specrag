[project]
name = "specrag"
version = "0.1.0"
description = "Evidence-grounded research agent for complex technical specifications"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "openai>=2.46.0,<3",
    "chromadb>=0.5.0",
    "sentence-transformers>=3.0.0",
    "tokenizers>=0.22.1,<0.23",
    "langgraph>=1.2.14,<2",
    "langgraph-checkpoint-sqlite>=3.1,<4",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "uvicorn>=0.30,<1",
]

[project.scripts]
specrag = "specrag.cli:main"
specrag-api = "specrag.interfaces.api:main"
specrag-worker = "specrag.interfaces.worker:main"

[project.optional-dependencies]
dev = [
    "httpx>=0.27,<1",
    "jupyterlab>=4,<5",
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/specrag"]

[tool.pytest.ini_options]
addopts = "--basetemp=.pytest_tmp"
pythonpath = ["src"]
testpaths = ["tests"]
