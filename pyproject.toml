[project]
name = "specrag"
version = "0.1.0"
description = "Evidence-grounded research agent for complex technical specifications"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "openai>=2.46.0,<3",
    "chromadb>=0.5.0",
    "sentence-transformers>=3.0.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/specrag"]

[tool.pytest.ini_options]
addopts = "--basetemp=.pytest_tmp"
pythonpath = ["src"]
testpaths = ["tests"]
