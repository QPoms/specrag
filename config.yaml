# RAG parameters. Secrets are loaded from .env.

retrieval:
  embedding_model: BAAI/bge-small-en-v1.5
  index_dir: .local/indexes/specifications
  specification_root: data/3gpp
  version_policy: highest_version_within_release
  target_release: 17
  chunk_characters: 2400
  chunk_overlap_characters: 300
  semantic_candidates_per_collection: 20
  lexical_candidates_per_collection: 20
  final_hits_per_collection: 6
  rrf_k: 60

# Version synchronization is intentionally dormant. `specrag corpus sync`
# performs a dry run unless --apply is supplied; no background scheduler runs.
corpus_sync:
  automatic_sync_enabled: false
  supported_releases: [17, 18, 19]

llm:
  temperature: 0.4
  max_retries: 3
  api_max_retries: 8
  api_retry_initial_delay_seconds: 1.0
  api_retry_max_delay_seconds: 15.0
  api_fallback_models:
    - gpt-5.6-sol
    - gpt-5.6-terra
    - gpt-5.6-luna
    - gpt-5.5
  # Conservative defaults apply to every model unless overridden by exact ID.
  context_default_profile:
    context_window_tokens: 128000
    max_input_tokens: 128000
    expected_output_tokens: 8000
  context_model_profiles: {}
  context_safety_ratio: 0.15
  context_large_window_threshold_tokens: 100000
  context_large_window_minimum_reserve_tokens: 16000
  tool_result_soft_limit_tokens: 4000
  compaction_recent_history_tokens: 15000
